version: 2
updates:
  # One entry owns the shared pnpm lockfile, including apps/packages/examples.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      runtime-compatible:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      tooling-compatible:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Security updates remain individual and independent of the weekly cadence.
    # Major version updates do not match either group and stay separately reviewable.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
